<div class="shell">
  <aside class="sidebar" [class.abierto]="menuAbierto()">
    <div class="marca">
      <a routerLink="/proyectos" class="marca-link">
        <svg class="marca-icono" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="10" height="3" rx="1" />
          <rect x="7" y="10.5" width="12" height="3" rx="1" />
          <path d="M18 17l3 2.5-3 2.5-3-2.5z" />
        </svg>
        <span>Gestión Pro</span>
      </a>
      <button
        type="button"
        class="menu-toggle"
        (click)="alternarMenu()"
        [attr.aria-expanded]="menuAbierto()"
        aria-controls="nav-principal"
        [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
      >
        <i [class]="menuAbierto() ? 'pi pi-times' : 'pi pi-bars'" aria-hidden="true"></i>
      </button>
    </div>

    <nav id="nav-principal" aria-label="Navegación principal">
      @for (grupo of menu(); track grupo.titulo) {
        <div class="grupo">
          <p class="grupo-titulo">{{ grupo.titulo }}</p>
          <ul>
            @for (item of grupo.items; track item.ruta) {
              <li>
                <a
                  [routerLink]="item.ruta"
                  routerLinkActive="activo"
                  ariaCurrentWhenActive="page"
                  (click)="menuAbierto.set(false)"
                >
                  <i [class]="item.icono" aria-hidden="true"></i>
                  {{ item.etiqueta }}
                </a>
              </li>
            }
          </ul>
        </div>
      }
    </nav>

    @if (usuario(); as u) {
      <div class="usuario">
        <span class="avatar" aria-hidden="true">{{ iniciales() }}</span>
        <span class="usuario-datos">
          <span class="usuario-nombre">{{ u.nombre }}</span>
          <span class="usuario-rol">{{ rolEtiqueta() }}</span>
        </span>
        <button type="button" class="salir" (click)="cerrarSesion()" aria-label="Cerrar sesión" title="Cerrar sesión">
          <i class="pi pi-sign-out" aria-hidden="true"></i>
        </button>
      </div>
    }
  </aside>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
